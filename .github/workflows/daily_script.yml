# =============================================================================
#  Apple App Store Connect → BigQuery Sync                          (v3.0)
#  repo: bigquery-terafort/apple_console_terafort_us
#  path: .github/workflows/daily_script.yml
# =============================================================================
#  ⚠️  YE FILE apple_store_connect WALI SE THORI ALAG HAI:
#        BQ_DATASET ka default = apple_console_terafort_us  (wahan apple_store_data)
#      Baqi sab bilkul same.
#
#  🔴 RUN #159 KA BUG — HEALTH CHECK JHOOT BOL RAHA THA
#  ────────────────────────────────────────────────────
#      Sync ne 2,570,750 rows load kiye (verified in BigQuery), phir
#      health check ne har table par "table nahi mili" likha.
#
#      WAJAH: GCP_PROJECT secret mein trailing space hai.
#        #182 (chalta hua) :  ── ***.***  ──
#        #159 (toota hua)  :  ── *** .*** ──   ← space
#
#      Python script bach jati hai kyunke wo strip karti hai:
#          GCP_PROJECT = os.environ["GCP_PROJECT"].strip()
#      Health check strip NAHI karta tha → `terafort .dataset.table`
#      → BadRequest (400), NotFound (404) nahi. Isi liye HAR table
#      ek jaisi fail hui.
#
#  🔴 RUN #160 KE DO BUG
#     a) python: can't open file '.../apple_to_bigquery.py'
#        Script root pe nahi hai. -> Ab workflow use ANDAR ke marker
#        ('ANALYTICS_REPORT_MAP') se dhoondhti hai, path se nahi.
#     b) BQ_DATASET is repo mein SECRET hai, VARIABLE nahi.
#        `vars.BQ_DATASET` hamesha khaali tha; sirf fallback default
#        ki wajah se sahi dataset laga. -> Ab `secrets.BQ_DATASET`.
#
#  v3.0 KE FIX:
#   1. 🔴 health check ab har env var .strip() karta hai
#   2. 🔴 BQ_DATASET ka default is repo ke liye sahi kiya
#         (pehle 'apple_store_data' tha — agar vars.BQ_DATASET kabhi
#          unset hua to ye repo DOOSRE vendor ke dataset mein likhti,
#          aur v3 script ki `date IN (...)` DELETE unki rows mita deti)
#   3. 🔴 TIMEOUT 60 → 150 min (v4 script retries lagati hai, waqt lagta hai)
#   4. 🆕 retry knobs env se: HTTP_RETRIES / HTTP_BACKOFF / SEGMENT_TIMEOUT
#   5. 🆕 _stg tables ki safai — har run ke baad copy chhod dete the
#   6. 🆕 health check mein freshness (sirf row count nahi)
#
#  ⚠️  EXIT CODE 1 KA MATLAB BADAL GAYA (v4 script):
#        v3: 1 = kuch load nahi hua (poora run zaya)
#        v4: 1 = kuch app/table chhoot gaye, BAQI SAB LOAD HO GAYA
#      Red X ab data-loss NAHI hai.
#
#  SECRETS: APPLE_KEY_ID · APPLE_ISSUER_ID · APPLE_PRIVATE_KEY ·
#           APPLE_VENDOR_NUMBER · GCP_PROJECT · GCP_CREDENTIALS_JSON
#  VARS:    BQ_DATASET = apple_console_terafort_us
# =============================================================================
name: Apple App Store Connect → BigQuery Sync

on:
  schedule:
    # 🔁 HAR 15 MINUTE — public repo par Actions FREE hai.
    #    Har run pehle BQ se poochti hai "kal ka data hai?" — hai to 10 sec
    #    mein skip. Nahi to poora loader (45 din MERGE). Der ≤ ~20 min.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      sales_lookback_days:
        description: "Sales ke kitne din kheenchein"
        default: '45'
      finance_lookback_months:
        description: "Finance ke kitne mahine"
        default: "6"
      http_retries:
        description: "Har HTTP call par kitni retries (default 3)"
        default: "3"
      segment_timeout:
        description: "S3 segment download timeout, seconds (default 300)"
        default: "300"

permissions:
  contents: write                # keepalive commit ke liye

concurrency:
  group: apple-sync-console-us
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Apple App Store Connect Data to BigQuery
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pyjwt cryptography google-cloud-bigquery python-dateutil
          fi

      - name: Run sync
        env:
          APPLE_KEY_ID:            ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID:         ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_PRIVATE_KEY:       ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_VENDOR_NUMBER:     ${{ secrets.APPLE_VENDOR_NUMBER }}
          GCP_PROJECT:             ${{ secrets.GCP_PROJECT }}
          GCP_CREDENTIALS_JSON:    ${{ secrets.GCP_CREDENTIALS_JSON }}
          # 🔴 default is repo ke liye — DOOSRE vendor ka dataset nahi
          BQ_DATASET:              ${{ secrets.BQ_DATASET || 'apple_console_terafort_us' }}
          SALES_LOOKBACK_DAYS:     ${{ steps.before.outputs.lookback || github.event.inputs.lookback_days || '45' }}
          FINANCE_LOOKBACK_MONTHS: ${{ github.event.inputs.finance_lookback_months || '3' }}
          HTTP_RETRIES:            ${{ github.event.inputs.http_retries || '3' }}
          HTTP_BACKOFF:            '5'
          SEGMENT_TIMEOUT:         ${{ github.event.inputs.segment_timeout || '300' }}
          API_TIMEOUT:             '60'
        run: |
          set -euo pipefail
          # Script ko path se nahi, ANDAR ke marker se dhoondho. Run #160 mein
          # 'apple_to_bigquery.py' root pe nahi mili thi.
          SCRIPT=$(grep -rl 'ANALYTICS_REPORT_MAP' --include='*.py' . 2>/dev/null | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "::error::Apple sync script nahi mili (koi .py mein ANALYTICS_REPORT_MAP nahi)"
            find . -name '*.py' -not -path './.git/*' | head -20
            exit 1
          fi
          echo "Using script: $SCRIPT"
          python "$SCRIPT"

      # 🧹 staging tables ki safai — har run ke baad poori copy chhod dete the.
      #    analytics_app_store_discovery_stg akela ~2.5M rows ka tha.
      - name: Clean staging tables
        if: always()
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GCP_PROJECT:          ${{ secrets.GCP_PROJECT }}
          BQ_DATASET:           ${{ secrets.BQ_DATASET || 'apple_console_terafort_us' }}
        run: |
          echo "$GCP_CREDENTIALS_JSON" > /tmp/gcp.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp.json
          python - <<'EOF'
          import os
          from google.cloud import bigquery
          project = os.environ["GCP_PROJECT"].strip()
          dataset = os.environ["BQ_DATASET"].strip()
          bq = bigquery.Client(project=project)
          dropped = 0
          for t in bq.list_tables(f"{project}.{dataset}"):
              if t.table_id.endswith("_stg"):
                  bq.delete_table(f"{project}.{dataset}.{t.table_id}", not_found_ok=True)
                  print(f"   dropped {t.table_id}")
                  dropped += 1
          print(f"   {dropped} staging table(s) cleaned")
          EOF

      # Health check — 🔴 v3: .strip() har env var par (run #159 ka bug)
      # ══════════════════════════════════════════════════════════════════════
      # 🔧 bq CLI — self-heal/verify ke liye. WAHI secret jo loader use karta hai.
      #    Koi naya secret nahi.
      # ══════════════════════════════════════════════════════════════════════
      - name: "🔑 GCP auth (bq ke liye)"
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: "🔧 setup-gcloud (bq CLI)"
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      # ══════════════════════════════════════════════════════════════════════
      # 🩺 SELF-HEAL ① — PEHLE ki haalat yaad rakho (rollback/verify ke liye)
      # ══════════════════════════════════════════════════════════════════════
      - name: "🩺 Pehle ki haalat — rows aur aakhri din"
        id: before
        continue-on-error: true
        run: |
          set +e
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(date) AS STRING) FROM \`terafort.Final_Staging_tables.apple_staging\`" 2>/dev/null | tail -1)
          ROWS=$(echo "$R" | cut -d, -f1); LAST=$(echo "$R" | cut -d, -f2)
          echo "📊 pehle: ${ROWS:-?} rows · aakhri din ${LAST:-?}"
          echo "rows=${ROWS:-0}" >> "$GITHUB_OUTPUT"
          echo "last=${LAST:-}"  >> "$GITHUB_OUTPUT"
          # ── gap dekh kar lookback tay karo ──
          LB="${{ github.event.inputs.lookback_days || '45' }}"
          if [[ "$LAST" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            GAP=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
            if [ "$GAP" -gt "$LB" ]; then
              LB=$(( GAP + 3 )); [ "$LB" -gt 180 ] && LB=180
              echo "::warning::🩺 Self-heal: data ${GAP} din purana — lookback ${LB} kiya"
            fi
          else
            # ── 🛡️ SAFETY NET: bq nahi chala (setup-gcloud nahi?) ──
            #    Bina jaanch ke har 15 min poora loader chalana = platform API par
            #    bojh (rate limit). Is liye sirf GHANTE KE SHURU mein chalao
            #    (:00–:14) — yani purane 1-ghanta cron jaisa. Baqi 15-min skip.
            MIN=$((10#$(date -u +%M)))
            if [ "$MIN" -ge 15 ]; then
              echo "⚠️ BQ check nahi ho saka — sirf ghante ke shuru mein chalta hoon (abhi :$MIN) — skip"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "lookback=$LB" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "⚠️ BQ check nahi ho saka — ghante ka shuru hai, loader chalega (lookback $LB)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ── 🔑 SKIP: kal ka data pehle se hai to kuch mat karo ──
          YESTERDAY=$(date -u -d yesterday +%F)
          if [[ "$LAST" > "$YESTERDAY" ]] || [[ "$LAST" == "$YESTERDAY" ]]; then
            echo "✅ kal ka data ($LAST) pehle se hai — skip, kuch nahi karna"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "🔍 kal ($YESTERDAY) ka data nahi — loader chalega"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "lookback=$LB" >> "$GITHUB_OUTPUT"

      # 🔁 RETRY — neeche wala main step 3 baar koshish karta hai.
      #    (nick-fields/retry se: platform API 5xx / timeout par khud dobara)
      - name: Health check
        if: steps.before.outputs.skip != 'true' && (always())
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GCP_PROJECT:          ${{ secrets.GCP_PROJECT }}
          BQ_DATASET:           ${{ secrets.BQ_DATASET || 'apple_console_terafort_us' }}
        run: |
          echo "$GCP_CREDENTIALS_JSON" > /tmp/gcp.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp.json
          python - <<'EOF'
          import os
          from google.cloud import bigquery

          # 🔴 .strip() — run #159 mein GCP_PROJECT ke trailing space ki wajah se
          #    `terafort .dataset.table` ban raha tha → BadRequest → har table
          #    "nahi mili" dikh rahi thi jabke data maujood tha.
          project = os.environ["GCP_PROJECT"].strip()
          dataset = os.environ["BQ_DATASET"].strip()

          bq = bigquery.Client(project=project)
          ds = f"{project}.{dataset}"
          print(f"\n-- {ds} " + "-"*40)

          DATED = {
              "sales_daily":                    "date",
              "analytics_installs":             "date",
              "analytics_sessions":             "date",
              "analytics_app_store_downloads":  "date",
              "analytics_app_store_discovery":  "date",
          }

          for t, col in DATED.items():
              try:
                  r = list(bq.query(
                      f"SELECT COUNT(*) n, CAST(MAX({col}) AS STRING) last_dt, "
                      f"DATE_DIFF(CURRENT_DATE(), MAX({col}), DAY) stale "
                      f"FROM `{ds}.{t}`").result())[0]
                  mark = "OK  " if (r.stale is not None and r.stale <= 4) else "OLD "
                  print(f"   [{mark}] {t:<32} {r.n:>10,} rows - last {r.last_dt} ({r.stale}d)")
              except Exception as e:
                  print(f"   [FAIL] {t:<32} {type(e).__name__}: {e}")

          try:
              r = list(bq.query(f"SELECT COUNT(*) n FROM `{ds}.finance_monthly`").result())[0]
              print(f"   [OK  ] {'finance_monthly':<32} {r.n:>10,} rows")
          except Exception as e:
              print(f"   [FAIL] {'finance_monthly':<32} {type(e).__name__}: {e}")

          # apps_dim ka bundle coverage — app_master_v2.ios_bundle_id ke liye lazmi
          try:
              q = f"""SELECT COUNT(*) apps,
                             COUNTIF(bundle_id IS NOT NULL AND TRIM(bundle_id)!='') bundles,
                             CAST(MAX(_loaded_at) AS STRING) last_load
                      FROM `{ds}.apps_dim`"""
              r = list(bq.query(q).result())[0]
              print(f"\n   apps_dim: {r.apps} apps - bundle_id bhara {r.bundles}/{r.apps}")
              print(f"   aakhri load: {r.last_load}")
              if r.bundles < r.apps:
                  print("   !! kuch apps par bundle_id khaali hai")
          except Exception as e:
              print(f"\n   [FAIL] apps_dim -- {type(e).__name__}: {e}")
              print("      -> BadRequest? GCP_PROJECT/BQ_DATASET secret mein")
              print("         trailing space ya newline check karein.")
              print("      -> NotFound? API key ka role check karein:")
              print("         App Store Connect > Users and Access > Integrations")
              print("         > Keys > role 'App Manager' ya 'Admin' hona chahiye")

          print("\n   NOTE: v4 script mein exit code 1 ka matlab 'kuch app/table")
          print("         chhoot gaye' hai -- 'kuch load nahi hua' NAHI.")
          EOF

  # ═══════════════════════════════════════════════════════════════════════
  #  KEEPALIVE — 60-din wala auto-disable rokta hai
  #     Koi third-party action nahi (org policy blocks) — seedha git.
  # ═══════════════════════════════════════════════════════════════════════

      # ══════════════════════════════════════════════════════════════════════
      # 🛡️ SELF-HEAL ② — BAAD mein VERIFY. Kharab data mile to run LAAL.
      # ══════════════════════════════════════════════════════════════════════
      #  Teen check:
      #    1. rows KAM to nahi ho gaye  (koi loader TRUNCATE kar ke mar gaya?)
      #    2. aakhri din PEECHE to nahi gaya
      #    3. aaj ke window mein NEGATIVE ya NULL key to nahi
      #  Koi bhi fail → exit 1 → workflow red → tum ko pata chalega.
      #  🔑 Loader khud MERGE karta hai, is liye rollback ki zaroorat nahi —
      #     purana data waise hi mehfooz rehta hai.
      - name: "🛡️ Baad mein verify — bad data nahi jaana chahiye"
        if: always() && steps.before.outputs.skip != 'true'
        run: |
          set +e
          BEFORE_ROWS="${{ steps.before.outputs.rows || '0' }}"
          BEFORE_LAST="${{ steps.before.outputs.last || '' }}"
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(date) AS STRING), COUNTIF(date IS NULL) FROM \`terafort.Final_Staging_tables.apple_staging\`" 2>/dev/null | tail -1)
          if [ -z "$R" ]; then
            echo "::warning::verify skip — bq query nahi chali (setup-gcloud hai?)"
            exit 0
          fi
          AFTER_ROWS=$(echo "$R" | cut -d, -f1); AFTER_LAST=$(echo "$R" | cut -d, -f2); NULLS=$(echo "$R" | cut -d, -f3)
          echo "📊 baad:  ${AFTER_ROWS} rows · aakhri din ${AFTER_LAST} · null dates ${NULLS}"
          FAIL=0
          # 1. rows 5% se zyada KAM ho gaye = kuch toota
          if [ "$BEFORE_ROWS" -gt 100 ] && [ "$AFTER_ROWS" -lt $(( BEFORE_ROWS * 95 / 100 )) ]; then
            echo "::error::🔴 ROWS KAM HO GAYE: $BEFORE_ROWS → $AFTER_ROWS — loader ne data URA DIYA"; FAIL=1
          fi
          # 2. aakhri din peeche gaya
          if [[ "$BEFORE_LAST" =~ ^[0-9]{4} ]] && [[ "$AFTER_LAST" < "$BEFORE_LAST" ]]; then
            echo "::error::🔴 AAKHRI DIN PEECHE GAYA: $BEFORE_LAST → $AFTER_LAST"; FAIL=1
          fi
          # 3. null date key
          if [ "${NULLS:-0}" -gt 0 ]; then
            echo "::error::🔴 ${NULLS} rows par date NULL hai — kharab data"; FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "::error::🔴 VERIFY FAIL — is run ka data bharosay ke qabil NAHI"
            exit 1
          fi
          echo "✅ verify pass — $(( AFTER_ROWS - BEFORE_ROWS )) rows badhe"

      # ══════════════════════════════════════════════════════════════════════
      # 📣 NAKAAMI PAR BATAO — chup-chaap fail na ho
      # ══════════════════════════════════════════════════════════════════════
      - name: "📣 Fail hua to summary mein likho"
        if: failure()
        run: |
          {
            echo "## 🔴 ${{ github.workflow }} — NAKAAM"
            echo "- run: ${{ github.run_id }}"
            echo "- waqt: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- pehle: ${{ steps.before.outputs.rows }} rows · ${{ steps.before.outputs.last }}"
            echo "- 🔁 agli scheduled run khud dobara koshish karegi (din mein 4x)"
            echo "- 🩺 self-heal gap dekh kar lookback barha dega"
          } >> "$GITHUB_STEP_SUMMARY"

  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keepalive commit (sirf agar 45 din se koi commit nahi)
        run: |
          set -euo pipefail
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "aakhri commit ko $DAYS din huye"

          if [ "$DAYS" -lt 45 ]; then
            echo "45 din se kam - commit ki zaroorat nahi"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "chore(keepalive): workflow ko zinda rakhne ke liye [skip ci]"
          git push
          echo "keepalive commit ho gaya - agle 60 din mehfooz"
